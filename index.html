<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ITSTYREE_ IRL Overlay</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent !important;
  }
  .overlay {
    position: fixed;
    left: 50%;
    bottom: 3vh;
    transform: translateX(-50%);
    width: min(34vw, 520px);
    min-width: 180px;
    pointer-events: none;
    user-select: none;
  }
  .overlay img {
    display: block;
    width: 100%;
    height: auto;
    background: transparent;
  }
</style>
</head>
<body>
  <div class="overlay">
    <img src="itstyree_logo.png" alt="ITSTYREE_">
  </div>
</body>
</html>
